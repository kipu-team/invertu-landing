<section class="final-cta">
    <div class="container final-grid">

        <div class="final-copy">
            <h2 data-i18n="final.title">Empieza a tomar decisiones con información más clara</h2>

            <div class="cta-actions">
                <a [href]="registerUrl" class="btn btn-white btn-lg" data-i18n="cta.signup">Crear cuenta gratis</a>
                <a [href]="loginUrl" class="btn btn-outline-white btn-lg" data-i18n="cta.login">Iniciar sesión</a>
            </div>
        </div>

        <div class="final-visual">
            <img
                src="img/cta-app.webp"
                alt="Laptop con la app de InvertU abierta en la pantalla de movimientos"
                data-i18n-attr="alt:final.imageAlt"
                loading="lazy"
            >
        </div>

    </div>
</section>
