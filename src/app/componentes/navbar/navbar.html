<header class="site-header" id="inicio">
  <div class="container header-inner">

    <a href="#hero" class="brand" (click)="irAlInicio($event)" [attr.aria-label]="idioma.t('header.homeLabel')">
      <img src="img/logo.png" class="brand-logo" [attr.alt]="idioma.t('header.logoAlt')">
    </a>

    <nav class="main-nav" id="main-nav" [class.open]="menuAbierto()" [attr.aria-label]="idioma.t('nav.label')">
      <a href="#hero" [class.active]="seccionActiva() === 'inicio'" (click)="irAlInicio($event)">{{ idioma.t('nav.home') }}</a>
      <a href="#beneficios" [class.active]="seccionActiva() === 'beneficios'" (click)="cerrarMenu()">{{ idioma.t('nav.benefits') }}</a>
      <a href="#asistente" [class.active]="seccionActiva() === 'asistente'" (click)="cerrarMenu()">{{ idioma.t('nav.assistant') }}</a>
      <a href="#testimonios" [class.active]="seccionActiva() === 'testimonios'" (click)="cerrarMenu()">{{ idioma.t('nav.testimonials') }}</a>
      <a href="#planes" [class.active]="seccionActiva() === 'planes'" (click)="cerrarMenu()">{{ idioma.t('nav.plans') }}</a>
      <a href="#ayuda" [class.active]="seccionActiva() === 'ayuda'" (click)="cerrarMenu()">{{ idioma.t('nav.help') }}</a>
      @if (esMovil()) {
        <ng-container [ngTemplateOutlet]="menuIdioma" />
      }
    </nav>

    <div class="header-ctas">

      <a [href]="loginUrl" class="btn btn-ghost header-login">{{ idioma.t('cta.login') }}</a>
      <a [href]="registerUrl" class="btn btn-primary header-signup">{{ idioma.t('cta.signup') }}</a>

      @if (!esMovil()) {
        <ng-container [ngTemplateOutlet]="menuIdioma" />
      }

      <button
        type="button"
        class="menu-toggle"
        id="menu-toggle"
        aria-controls="main-nav"
        [attr.aria-expanded]="menuAbierto()"
        [attr.aria-label]="idioma.t(menuAbierto() ? 'menu.close' : 'menu.open')"
        (click)="alternarMenu()"
      >
        <i class="fa-solid fa-bars" aria-hidden="true"></i>
      </button>

    </div>

  </div>
</header>

<ng-template #menuIdioma>
      <div class="lang-menu" id="lang-menu">
        <button
          type="button"
          class="lang-toggle"
          id="lang-toggle"
          aria-haspopup="true"
          [attr.aria-expanded]="menuIdiomaAbierto()"
          aria-controls="lang-list"
         
          [attr.aria-label]="idioma.t('lang.label')"
          (click)="alternarMenuIdioma()"
        >
          <i class="fa-solid fa-globe" aria-hidden="true"></i>
          <span class="lang-current" id="lang-current">{{ idioma.idioma().toUpperCase() }}</span>
          <i class="fa-solid fa-chevron-down lang-chevron" aria-hidden="true"></i>
        </button>

        <ul class="lang-list" id="lang-list" role="list" [hidden]="!menuIdiomaAbierto()">
          <li>
            <button type="button" class="lang-btn" lang="es"
                    [attr.aria-pressed]="idioma.idioma() === 'es'"
                    (click)="elegir('es')">
              <span class="lang-code" aria-hidden="true">ES</span> Español
            </button>
          </li>
          <li>
            <button type="button" class="lang-btn" lang="en"
                    [attr.aria-pressed]="idioma.idioma() === 'en'"
                    (click)="elegir('en')">
              <span class="lang-code" aria-hidden="true">EN</span> English
            </button>
          </li>
        </ul>
      </div>
</ng-template>
