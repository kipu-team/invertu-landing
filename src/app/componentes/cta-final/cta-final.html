<section class="final-cta">
    <div class="container final-grid">

        <div appReveal class="final-copy">
            <h2>{{ idioma.t('final.title') }}</h2>

            <div class="cta-actions">
                <a [href]="registerUrl" class="btn btn-white btn-lg">{{ idioma.t('cta.signup') }}</a>
                <a [href]="loginUrl" class="btn btn-outline-white btn-lg">{{ idioma.t('cta.login') }}</a>
            </div>
        </div>

        <div appReveal class="final-visual">
            <img
                src="img/cta-app.webp"
               
                [attr.alt]="idioma.t('final.imageAlt')"
                loading="lazy"
            >
        </div>

    </div>
</section>
