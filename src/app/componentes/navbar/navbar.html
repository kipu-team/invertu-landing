<header class="site-header" id="inicio">
  <div class="container header-inner">

    <a href="#inicio" class="brand" aria-label="InvertU, ir al inicio" data-i18n-attr="aria-label:header.homeLabel">
      <img src="img/logo.png" alt="Logo de InvertU" class="brand-logo" data-i18n-attr="alt:header.logoAlt">
    </a>

    <nav class="main-nav" id="main-nav" aria-label="Navegación principal" data-i18n-attr="aria-label:nav.label">
      <a href="#inicio" class="active">{{ idioma.t('nav.home') }}</a>
      <a href="#beneficios">{{ idioma.t('nav.benefits') }}</a>
      <a href="#asistente">{{ idioma.t('nav.assistant') }}</a>
      <a href="#testimonios">{{ idioma.t('nav.testimonials') }}</a>
      <a href="#planes">{{ idioma.t('nav.plans') }}</a>
      <a href="#ayuda">{{ idioma.t('nav.help') }}</a>
    </nav>

    <div class="header-ctas">

      <a [href]="loginUrl" class="btn btn-ghost header-login">{{ idioma.t('cta.login') }}</a>
      <a [href]="registerUrl" class="btn btn-primary header-signup">{{ idioma.t('cta.signup') }}</a>

      <div class="lang-menu" id="lang-menu">
        <button
          type="button"
          class="lang-toggle"
          id="lang-toggle"
          aria-haspopup="true"
          [attr.aria-expanded]="menuIdiomaAbierto()"
          aria-controls="lang-list"
          aria-label="Idioma"
          data-i18n-attr="aria-label:lang.label"
          (click)="alternarMenuIdioma()"
        >
          <i class="fa-solid fa-globe" aria-hidden="true"></i>
          <span class="lang-current" id="lang-current">{{ idioma.idioma().toUpperCase() }}</span>
          <i class="fa-solid fa-chevron-down lang-chevron" aria-hidden="true"></i>
        </button>

        <ul class="lang-list" id="lang-list" role="list" [hidden]="!menuIdiomaAbierto()">
          <li>
            <button type="button" class="lang-btn" lang="es"
                    [attr.aria-pressed]="idioma.idioma() === 'es'"
                    (click)="elegir('es')">
              <span class="lang-code" aria-hidden="true">ES</span> Español
            </button>
          </li>
          <li>
            <button type="button" class="lang-btn" lang="en"
                    [attr.aria-pressed]="idioma.idioma() === 'en'"
                    (click)="elegir('en')">
              <span class="lang-code" aria-hidden="true">EN</span> English
            </button>
          </li>
        </ul>
      </div>

      <button
        type="button"
        class="menu-toggle"
        id="menu-toggle"
        aria-controls="main-nav"
        aria-expanded="false"
        aria-label="Abrir menú"
      >
        <i class="fa-solid fa-bars" aria-hidden="true"></i>
      </button>

    </div>

  </div>
</header>
