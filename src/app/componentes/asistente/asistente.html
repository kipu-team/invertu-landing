<section id="asistente" class="assistant section--dark">
    <div class="container assistant-grid">

        <div class="assistant-copy">

            <span class="badge badge--gold">
                <i class="fa-solid fa-robot" aria-hidden="true"></i>
                <span>{{ idioma.t('assistant.badge') }}</span>
            </span>

            <h2>{{ idioma.t('assistant.title') }}</h2>

            <p>{{ idioma.t('assistant.text') }}</p>

            <ul class="prompts" role="list">
                <li>
                    <button type="button" class="prompt" data-chat="1" aria-pressed="true" aria-controls="chat-messages">
                        <span>{{ idioma.t('assistant.q1') }}</span>
                        <i class="fa-solid fa-chevron-right" aria-hidden="true"></i>
                    </button>
                </li>
                <li>
                    <button type="button" class="prompt" data-chat="2" aria-pressed="false" aria-controls="chat-messages">
                        <span>{{ idioma.t('assistant.q2') }}</span>
                        <i class="fa-solid fa-chevron-right" aria-hidden="true"></i>
                    </button>
                </li>
                <li>
                    <button type="button" class="prompt" data-chat="3" aria-pressed="false" aria-controls="chat-messages">
                        <span>{{ idioma.t('assistant.q3') }}</span>
                        <i class="fa-solid fa-chevron-right" aria-hidden="true"></i>
                    </button>
                </li>
            </ul>

            <a href="#planes" class="btn btn-gold btn-lg">{{ idioma.t('assistant.cta') }}</a>

        </div>

        <div class="assistant-visual">

            <div class="chat" role="group" aria-label="Ejemplo de conversación con el asistente" data-i18n-attr="aria-label:chat.label">

                <div class="chat-header">
                    <span class="chat-avatar"><i class="fa-solid fa-robot" aria-hidden="true"></i></span>
                    <div>
                        <strong>{{ idioma.t('chat.name') }}</strong>
                        <small>{{ idioma.t('chat.status') }}</small>
                    </div>
                </div>

                <div class="chat-messages" id="chat-messages" aria-live="polite">
                    <p class="chat-bubble chat-bubble--user" id="chat-question">{{ idioma.t('assistant.q1') }}</p>
                    <div class="chat-bubble chat-bubble--bot chat-typing" id="chat-typing" aria-hidden="true" hidden>
                        <span></span><span></span><span></span>
                    </div>
                    <p class="chat-bubble chat-bubble--bot" id="chat-answer">{{ idioma.t('assistant.a1') }}</p>
                </div>

                <div class="chat-input">
                    <input
                        type="text"
                        placeholder="Escribe un mensaje..."
                        aria-label="Campo de mensaje (solo demostración)"
                        data-i18n-attr="placeholder:chat.placeholder, aria-label:chat.inputLabel"
                        disabled
                    >
                    <button type="button" aria-label="Enviar (solo demostración)" data-i18n-attr="aria-label:chat.send" disabled>
                        <i class="fa-solid fa-paper-plane" aria-hidden="true"></i>
                    </button>
                </div>

            </div>

            <img
                src="img/mascot.png"
                alt="Mascota de InvertU saludando"
                class="mascot"
                data-i18n-attr="alt:chat.mascotAlt"
            >

        </div>

    </div>
</section>
